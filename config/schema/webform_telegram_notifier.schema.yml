webform_telegram_notifier.settings:
  type: config_object
  label: 'Webform Telegram Notifier settings'
  mapping:
    bot_token:
      type: string
      label: 'Bot token'
    chat_id:
      type: string
      label: 'Chat ID'
    parse_mode:
      type: string
      label: 'Parse mode'
    enabled_webforms:
      type: sequence
      label: 'Enabled webforms'
      sequence:
        type: string
    message:
      type: text
      label: 'Message template'
