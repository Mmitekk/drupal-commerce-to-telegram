commerce_to_telegram.settings:
  type: config_object
  label: 'Commerce to Telegram settings'
  mapping:
    bot_token:
      type: string
      label: 'Bot token'
    chat_id:
      type: string
      label: 'Chat ID'
    parse_mode:
      type: string
      label: 'Parse mode'
    api_url:
      type: string
      label: 'Telegram API base URL'
    proxy:
      type: string
      label: 'Proxy for Telegram API'
    resolve_ip:
      type: string
      label: 'Direct IP for Telegram API'
    commerce:
      type: mapping
      label: 'Drupal Commerce integration'
      mapping:
        enabled:
          type: boolean
          label: 'Enabled'
        message:
          type: text
          label: 'Order message template'
    webform:
      type: mapping
      label: 'Webform integration'
      mapping:
        enabled_forms:
          type: sequence
          label: 'Enabled webforms'
          sequence:
            type: string
        message:
          type: text
          label: 'Submission message template'
